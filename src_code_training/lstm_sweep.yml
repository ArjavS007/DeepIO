program: train_sweep.py

method: bayes
metric:
  name: test_loss
  goal: minimize

parameters:
  hidden_size:
    values: [768, 1024, 1400]

  num_blocks:
    values: [3, 4, 6]

  lstm_layers:
    values: [1]

  norm_type:
    values: ["layer", "rms", "none"]

  norm_position:
    values: ["pre", "post"]

  residuals:
    values: [true]

  residual_scale:
    values: [0.5, 0.7, 1.0]

  dropout_lstm:
    values: [0.0, 0.05]

  dropout_output:
    values: [0.05, 0.1]

  init_type:
    values: ["orthogonal", "xavier", "default"]

  lr:
    values: [3e-4, 5e-4, 1e-3]

  batch_size:
    values: [128, 256]

  window_size:
    values: [50, 100, 200]

  patience:
    value: 10

  lr_patience:
    value: 7

  last_lr_change_patience:
    value: 5
